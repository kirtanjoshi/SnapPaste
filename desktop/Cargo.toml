[package]
name = "snappaste-desktop"
version = "0.1.0"
edition = "2021"
description = "SnapPaste Desktop — instant Android screenshot → Windows clipboard"

[dependencies]
log = "0.4"
env_logger = "0.11"
tray-icon = "0.19"
windows = { version = "0.58.0", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
image = { version = "0.25", default-features = false, features = ["png"] }





